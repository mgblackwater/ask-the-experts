<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3390ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Experts">
<title>Roundtable</title>
<style>
/* A messenger-style chat page (in the spirit of Telegram): your messages in blue on the right,
   thinkers on the left with avatar and coloured name, round markers and notes as centred service
   messages, question cards as inline buttons, and @ to tag who should answer. */
:root{
  --chat:#d9e4ee; --pat:rgba(255,255,255,.35); --head:#ffffff; --head-ink:#000000; --sub:#707579;
  --in:#ffffff; --in-ink:#000000; --out:#3390ec; --out-ink:#ffffff; --out-sub:rgba(255,255,255,.75);
  --svc:rgba(0,0,0,.28); --svc-ink:#ffffff; --card:rgba(255,255,255,.92); --line:#e3e6ea; --muted:#707579;
  --accent:#3390ec; --link:#2481cc; --mention:#2481cc; --quote:#3390ec; --shadow:0 1px 1.5px rgba(0,0,0,.13);
  --n1:#d14e4e; --n2:#3f9a34; --n3:#b8860b; --n4:#2f7fc1; --n5:#7b62d6; --n6:#cf4f8a; --n7:#2a9a9c; --n8:#d9772f;
  --self:#2a9a9c; --ai:linear-gradient(135deg,#6a7cf5,#b46ef0);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --chat:#0e1621; --pat:rgba(255,255,255,.025); --head:#17212b; --head-ink:#f5f5f5; --sub:#7d8b99;
  --in:#182533; --in-ink:#f5f5f5; --out:#2b5278; --out-ink:#f5f5f5; --out-sub:rgba(245,245,245,.6);
  --svc:rgba(0,0,0,.35); --card:#182533; --line:#24313f; --muted:#7d8b99;
  --accent:#5eb5f7; --link:#6ab3f3; --mention:#6ab3f3; --quote:#6ab3f3; --shadow:none;
  --n1:#ff8a8a; --n2:#7bd06e; --n3:#e8c66a; --n4:#6ab3f3; --n5:#b49cff; --n6:#ff8fc4; --n7:#6fd6d8; --n8:#ffaa6b; --self:#6fd6d8;
}}
:root[data-theme="dark"]{
  --chat:#0e1621; --pat:rgba(255,255,255,.025); --head:#17212b; --head-ink:#f5f5f5; --sub:#7d8b99;
  --in:#182533; --in-ink:#f5f5f5; --out:#2b5278; --out-ink:#f5f5f5; --out-sub:rgba(245,245,245,.6);
  --svc:rgba(0,0,0,.35); --card:#182533; --line:#24313f; --muted:#7d8b99;
  --accent:#5eb5f7; --link:#6ab3f3; --mention:#6ab3f3; --quote:#6ab3f3; --shadow:none;
  --n1:#ff8a8a; --n2:#7bd06e; --n3:#e8c66a; --n4:#6ab3f3; --n5:#b49cff; --n6:#ff8fc4; --n7:#6fd6d8; --n8:#ffaa6b; --self:#6fd6d8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--in-ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{background-color:var(--chat);
  background-image:radial-gradient(var(--pat) 1.2px,transparent 1.3px),radial-gradient(var(--pat) 1.2px,transparent 1.3px);
  background-size:28px 28px;background-position:0 0,14px 14px;background-attachment:fixed}
a{color:var(--link)}
button{font:inherit;cursor:pointer;color:inherit}

/* header */
.top{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--head);color:var(--head-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.back{display:none;font-size:1.6rem;line-height:1;text-decoration:none;color:var(--accent);padding:0 4px}
body.served .back{display:block}
.stack{display:flex;flex:none}
.stack .av{width:34px;height:34px;margin-left:-12px;border:2px solid var(--head);font-size:.68rem}
.stack .av:first-child{margin-left:0}
.ttl{flex:1;min-width:0}
.ttl .name{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub{font-size:.8rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .sub.typing-now{color:var(--accent)}
.tools{display:flex;gap:4px;align-items:center;flex:none}
.tool{border:none;background:none;border-radius:8px;padding:6px 8px;font-size:.82rem;color:var(--sub)}
.tool:hover{background:rgba(127,127,127,.12);color:var(--head-ink)}
.tool[aria-pressed="true"]{color:var(--accent)}
.ia{display:none}
body.interactive .ia{display:inline-block}
.live{display:none} /* every chat can be continued at any time, so a LIVE/FINISHED badge says little; the element still tracks state */
.live{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:#e53935}
.live.done{background:var(--muted)}
.live.paused{background:#c98a00}
.pinned{position:sticky;top:50px;z-index:7;display:flex;gap:10px;align-items:flex-start;padding:7px 14px;background:var(--head);border-top:1px solid var(--line);font-size:.8rem;color:var(--sub);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pinned b{color:var(--accent);font-weight:600;flex:none}
.pinned span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* chat */
.wrap{max-width:760px;margin:0 auto;padding:10px 12px 130px}
.svc{display:flex;justify-content:center;margin:12px 0}
.svc > span{background:var(--svc);color:var(--svc-ink);font-size:.8rem;font-weight:500;padding:3px 11px;border-radius:999px;text-align:center}
.note{margin:12px auto;max-width:560px;background:var(--card);border-radius:14px;padding:9px 13px;font-size:.88rem;box-shadow:var(--shadow);color:var(--in-ink)}
.note .tag{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
.note p{margin:.3em 0}
.msg{display:flex;gap:8px;align-items:flex-end;margin:6px 0}
.msg.out{justify-content:flex-end}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:650;font-size:.78rem;letter-spacing:.02em}
.av img{width:100%;height:100%;display:block}
.bubble{position:relative;max-width:min(560px,82%);min-width:120px;padding:6px 10px 6px 11px;border-radius:14px;background:var(--in);color:var(--in-ink);box-shadow:var(--shadow)}
.msg.in .bubble{border-bottom-left-radius:4px}
.msg.out .bubble{background:var(--out);color:var(--out-ink);border-bottom-right-radius:4px}
.msg.in .bubble::before,.msg.out .bubble::after{content:"";position:absolute;bottom:0;width:9px;height:14px}
.msg.in .bubble::before{left:-6px;background:radial-gradient(circle at 0 0,transparent 9px,var(--in) 9.5px)}
.msg.out .bubble::after{right:-6px;background:radial-gradient(circle at 100% 0,transparent 9px,var(--out) 9.5px)}
.who{font-size:.85rem;font-weight:600;margin-bottom:1px}
.who .edited{font-weight:400;font-size:.72rem;color:var(--muted);margin-left:6px}
.body p{margin:.25em 0;white-space:pre-wrap;overflow-wrap:anywhere}
.body p:first-child{margin-top:0}.body p:last-child{margin-bottom:0}
.mention{color:var(--mention);font-weight:600}
.msg.out .mention{color:var(--out-ink);text-decoration:underline;text-underline-offset:2px}
.quote{border-left:3px solid var(--quote);padding:2px 8px;margin:2px 0 5px;border-radius:4px;background:rgba(51,144,236,.08);font-size:.82rem}
.msg.out .quote{border-left-color:var(--out-ink);background:rgba(255,255,255,.15)}
.quote b{display:block;color:var(--quote);font-weight:600}
.msg.out .quote b{color:var(--out-ink)}
.quote span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.meta{float:right;margin:6px 0 -3px 10px;font-size:.7rem;color:var(--muted);white-space:nowrap}
.msg.out .meta{color:var(--out-sub)}
.clear{clear:both}
.acts{display:none;gap:12px;margin-top:3px}
body.interactive .acts{display:flex}
.acts button{border:none;background:none;padding:0;font-size:.75rem;color:var(--muted)}
.acts button:hover{color:var(--accent)}
.bubble textarea{width:100%;min-height:90px;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--chat);color:var(--in-ink)}
/* AI and research */
.av.ai{background:var(--ai);font-size:.95rem}
.srcs{margin-top:6px;font-size:.82rem}
.srcs summary{cursor:pointer;color:var(--accent);font-weight:500}
.srcs ul{margin:4px 0 0;padding-left:18px}
.srcs li{margin:3px 0}
.doc{display:flex;gap:9px;align-items:center;margin:2px 0 4px}
.doc .ic{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1rem}
.doc .t{font-weight:600;font-size:.9rem}
.ev h4{margin:9px 0 3px;font-size:.86rem}
.ev ul{margin:0 0 4px;padding-left:18px;font-size:.86rem}
.ev li{margin:3px 0}
.ev .bottom{font-size:.84rem;margin:3px 0 8px;color:var(--muted)}
.ev details > summary{cursor:pointer;color:var(--accent);font-size:.84rem;font-weight:500;margin:2px 0}
/* typing */
.dots{display:inline-flex;gap:4px;padding:6px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:blink 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
.item{transition:opacity .3s ease, transform .3s ease}
.item.hidden{display:none}
.item.enter{opacity:0;transform:translateY(6px)}
/* question cards as inline buttons */
.ask{margin:10px auto;max-width:560px}
.ask .card{background:var(--card);border-radius:14px 14px 6px 6px;padding:9px 13px;box-shadow:var(--shadow)}
.hl{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:1px 0 2px}
.askhead{display:flex;gap:9px;align-items:center;margin-bottom:4px}
.askhead .av{width:30px;height:30px;font-size:.7rem}
.askhead .who{color:var(--accent);margin:0}
.ask .title{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
.ask .qt{font-weight:600;font-size:.9rem;margin:8px 0 6px}
.ask .qt:first-of-type{margin-top:2px}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px;margin-top:4px}
.kb button{border:none;border-radius:8px;padding:8px 10px;background:var(--svc);color:var(--svc-ink);text-align:center;font-size:.86rem;font-weight:500}
.kb button small{display:block;font-weight:400;font-size:.72rem;opacity:.85;margin-top:1px}
.kb button.on{background:var(--accent);color:#fff}
.ask .other{width:100%;margin-top:6px;font:inherit;font-size:.86rem;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--in);color:var(--in-ink)}
.ask .go{display:block;width:100%;margin-top:4px;border:none;border-radius:6px 6px 14px 14px;padding:9px;background:var(--accent);color:#fff;font-weight:600}
/* composer */
.composer{display:none;position:fixed;left:0;right:0;bottom:0;z-index:8;padding:8px 12px 12px;background:linear-gradient(transparent,var(--chat) 30%)}
body.interactive .composer{display:block}
.composer .inner{position:relative;max-width:760px;margin:0 auto}
.reply{display:none;align-items:center;gap:8px;background:var(--in);border-radius:12px 12px 0 0;padding:6px 12px;font-size:.82rem;border-left:3px solid var(--accent);margin:0 52px}
.reply.on{display:flex}
.reply span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--accent)}
.reply button{border:none;background:none;color:var(--muted);font-size:1rem}
.row{display:flex;gap:8px;align-items:flex-end}
.row textarea{flex:1;min-height:44px;max-height:160px;resize:none;font:inherit;padding:11px 16px;border-radius:22px;border:none;background:var(--in);color:var(--in-ink);box-shadow:var(--shadow);outline:none}
.reply.on + .row textarea{border-top-left-radius:0;border-top-right-radius:0}
.clip{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:var(--in);color:var(--muted);font-size:1.15rem;box-shadow:var(--shadow)}
.clip:hover{color:var(--accent)}
.pending{display:flex;flex-wrap:wrap;gap:6px;margin:0 52px 6px}
.pending:empty{display:none}
.pend{display:flex;align-items:center;gap:6px;background:var(--in);border-radius:10px;padding:4px 8px;font-size:.8rem;box-shadow:var(--shadow);max-width:220px}
.pend img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.pend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend button{border:none;background:none;color:var(--muted)}
.att{margin:2px 0 4px;display:flex;flex-direction:column;gap:4px}
.att img{max-width:100%;max-height:260px;border-radius:10px;display:block;cursor:zoom-in}
.att a.file{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;background:rgba(0,0,0,.08);border-radius:10px;padding:6px 10px}
.msg.out .att a.file{background:rgba(255,255,255,.18)}
.att a.file b{font-weight:600;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att a.file small{opacity:.75;font-size:.72rem}
.addp{color:var(--accent);font-weight:600}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.1rem;display:grid;place-items:center;box-shadow:var(--shadow)}
.send:disabled{opacity:.5}
.hint{font-size:.72rem;color:var(--muted);margin:4px 14px 0}
.mentions{display:none;position:absolute;left:52px;right:52px;bottom:calc(100% + 6px);max-height:260px;overflow:auto;background:var(--in);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:4px}
.mentions.on{display:block}
.mentions button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:6px 8px;border-radius:8px;text-align:left}
.mentions button.on,.mentions button:hover{background:rgba(51,144,236,.12)}
.mentions .av{width:32px;height:32px;font-size:.66rem}
.mentions .nm{font-weight:600;font-size:.88rem}
.mentions .hd{font-size:.76rem;color:var(--muted)}
.sheet{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .panel{width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;background:var(--in);color:var(--in-ink);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.25)}
@media (min-width:600px){.sheet{align-items:center}.sheet .panel{border-radius:16px}}
.sheet .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
.sheet .hd span{flex:1}
.sheet .hd button{border:none;background:none;color:var(--muted);font-size:1.1rem}
.sheet input{margin:10px 14px 4px;font:inherit;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--chat);color:var(--in-ink);outline:none}
.sheet .list{overflow:auto;padding:4px 6px}
.sheet .who-row{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:7px 8px;border-radius:10px;text-align:left}
.sheet .who-row:hover{background:rgba(51,144,236,.1)}
.sheet .who-row.on{background:rgba(51,144,236,.18)}
.sheet .who-row .nm{font-weight:600;font-size:.9rem}
.sheet .who-row .ln{font-size:.76rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.sheet .who-row .tick{margin-left:auto;flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:.7rem}
.sheet .who-row.on .tick{background:var(--accent);border-color:var(--accent)}
.sheet .ft{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.sheet .ft span{flex:1;font-size:.8rem;color:var(--muted)}
.sheet .ft button{border:none;border-radius:20px;padding:8px 18px;background:var(--accent);color:#fff;font-weight:600}
.sheet .ft button:disabled{opacity:.5}
footer{margin:24px 0 0;color:var(--muted);font-size:.78rem;text-align:center}
@media (prefers-reduced-motion: reduce){.item{transition:none}.dots i{animation:none;opacity:.7}}
@media (max-width:520px){.av{width:32px;height:32px}.bubble{max-width:86%}.tools .tool.hide-sm{display:none}}
.ico{vertical-align:-4px;flex:none}
.tick .ico,.badge .ico,.chip .ico,.x .ico{width:14px;height:14px}
.send .ico{width:20px;height:20px}
.clip .ico,.arch .ico{width:20px;height:20px}
.archrow .ic .ico{width:24px;height:24px}
.fab .ico,.pill .ico,.attach .ico{margin-right:2px}
button .ico + *,.ico + span{margin-left:0}
.top{padding-top:calc(8px + env(safe-area-inset-top))}
.composer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="./" target="_top" title="All chats" data-icon="back"></a>
  <div class="stack" id="stack"></div>
  <div class="ttl"><div class="name" id="title"></div><div class="sub" id="sub"></div></div>
  <div class="tools" id="tools">
    <button class="tool" id="replay" type="button" title="Replay as chat" data-icon="play" data-label="Replay"></button>
    <button class="tool hide-sm" id="speed" type="button" title="Replay speed">1×</button>
    <button class="tool hide-sm" id="all" type="button" title="Show everything">Show all</button>
    <button class="tool ia addp" id="addppl" type="button" title="Add a person to this chat" data-icon="userPlus" data-label="Add person"></button>
    <button class="tool ia" id="pause" type="button">Pause</button>
    <button class="tool ia" id="archbtn" type="button" title="Archive this chat (nothing is deleted)" data-icon="archive" data-label="Archive"></button>
    <button class="tool ia" id="wrap" type="button">Wrap up</button>
    <button class="tool" id="theme" type="button" title="Switch light / dark" data-icon="moon"></button>
  </div>
</header>
<div class="pinned"><b>Pinned</b><span id="notice"></span></div>
<div class="wrap">
  <div class="svc" id="date"></div>
  <main id="feed" aria-live="polite"></main>
  <footer id="foot"></footer>
</div>
<div class="composer" id="composer">
  <div class="inner">
    <div class="mentions" id="mentions" role="listbox" aria-label="Tag someone"></div>
    <div class="reply" id="replyto"><span id="replytext"></span><button type="button" id="replyclear" title="Stop replying" data-icon="close"></button></div>
    <div class="pending" id="pending"></div>
    <div class="row">
      <button type="button" class="clip" id="clip" title="Attach images or documents" aria-label="Attach files" data-icon="clip"></button>
      <input type="file" id="files" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.txt,.md,.csv,.json,.docx,.xlsx,.pptx">
      <textarea id="msg" rows="1" placeholder="Message… type @ to tag someone" aria-label="Your message to the table"></textarea>
      <button type="button" class="send" id="send" title="Send" aria-label="Send" data-icon="send"></button>
    </div>
    <div class="hint" id="hint">Enter to send, Shift+Enter for a new line. Tag @someone to have them answer next, or @Claude to ask the host.</div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add people">
  <div class="panel">
    <div class="hd"><span>Add people to this chat</span><button type="button" id="sheetx" title="Close" data-icon="close"></button></div>
    <input id="sheetq" type="search" placeholder="Search people" aria-label="Search people">
    <div class="list" id="sheetlist"></div>
    <div class="ft"><span id="sheetmsg">Whoever you pick joins this chat and reads it so far.</span><button type="button" id="sheetgo" disabled>Add</button></div>
  </div>
</div>

<!-- Filled by scripts/render_roundtable.py -->
<script type="application/json" id="roundtable-data">{"title":"Roundtable","topic":"","date":"","participants":[],"items":[]}</script>

<script>
(function(){
  var data;
  try { data = JSON.parse(document.getElementById('roundtable-data').textContent); }
  catch(e){ data = {title:'Roundtable', participants:[], items:[]}; }

  // ---- people --------------------------------------------------------------
  var palette = ['var(--n4)','var(--n1)','var(--n2)','var(--n5)','var(--n8)','var(--n6)','var(--n3)','var(--n7)'];
  var people = {}, pi = 0;
  var hostName = String(data.host || 'Claude');
  var AI = {id:'ai', name:hostName, kind:'ai', initials:hostName.replace(/^(Mr|Ms|Mrs|Dr)\.?\s+/i,'').slice(0,1).toUpperCase(), handle:hostName.replace(/[^A-Za-z0-9\-]/g,'') || 'Claude', color:'var(--accent)', lens:'Host: runs the table, looks things up, asks you questions'};
  function handleFor(p){
    if(p.kind==='self') return (p.name||'').split(/\s+/)[0];
    var w = (p.name||'').replace(/[^A-Za-z0-9 \-]/g,'').trim().split(/\s+/);
    return w[w.length-1] || p.id;
  }
  function addPerson(p){
    if(!p || !p.id || people[p.id]) return false;

          badge.textContent = 'FINISHED'; badge.className = 'live done'; setSpeaking(null); renderAsk(null); renderNote(null);
          if(!/Picked up|Sent/.test(hint.textContent)) hint.textContent = 'This chat has finished. Send a message to pick it up again.';
        } else if(badge.classList.contains('done')){ badge.className = 'live'; badge.textContent = 'LIVE'; setPaused(d.paused); }
      })
      .catch(function(){});
  }
  var timerPoll = setInterval(poll, 3000); poll();

  // The message box, Reply, Edit, Pause and Wrap only appear when roundtable_server.py answers.
  fetch('api/ping', {cache:'no-store'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
    if(j && j.ok) document.body.classList.add('interactive');
  }).catch(function(){});
  setPaused(paused);

  // ---- add people ------------------------------------------------------------------
  var sheet = document.getElementById('sheet'), sheetList = document.getElementById('sheetlist'), sheetQ = document.getElementById('sheetq');
  var sheetGo = document.getElementById('sheetgo'), sheetMsg = document.getElementById('sheetmsg'), roster = null, chosen = [];
  function drawSheet(){
    var q = sheetQ.value.trim().toLowerCase(); sheetList.textContent = '';
    (roster||[]).filter(function(p){ return !people[p.slug] && (!q || (p.name+' '+p.lens).toLowerCase().indexOf(q)>=0); }).forEach(function(p){
      var on = chosen.indexOf(p.slug)>=0, b = el('button','who-row' + (on ? ' on' : '')); b.type='button';
      var face = {name:p.name, initials:String(p.name||'?').replace(/^The\s+/,'').split(/\s+/).map(function(w){return w[0]}).join('').slice(0,2).toUpperCase(),
                  color: p.self ? 'var(--self)' : 'var(--n4)', avatar: p.avatar ? p.slug : null};
      b.appendChild(avatar(face));
      var t = el('div'); t.appendChild(el('div','nm', p.self ? 'Me (' + p.name + ')' : p.name)); t.appendChild(el('div','ln', p.lens)); b.appendChild(t);
      var tk = el('span','tick'); if(on) tk.appendChild(svgIcon('check')); b.appendChild(tk);
      b.addEventListener('click', function(){ var i=chosen.indexOf(p.slug); if(i<0) chosen.push(p.slug); else chosen.splice(i,1); drawSheet(); });
      sheetList.appendChild(b);
    });
    if(!sheetList.children.length) sheetList.appendChild(el('div','note','Everyone is already here.'));
    sheetGo.disabled = !chosen.length;
    sheetGo.textContent = chosen.length ? 'Add ' + chosen.length : 'Add';
  }
  function openSheet(){
    chosen = []; sheetQ.value = ''; sheet.classList.add('on');
    if(roster){ drawSheet(); return; }
    fetch('api/roster', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){ roster = j.people || []; drawSheet(); });
  }
  function closeSheet(){ sheet.classList.remove('on'); }
  document.getElementById('addppl').addEventListener('click', openSheet);
  document.getElementById('sheetx').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function(e){ if(e.target === sheet) closeSheet(); });
  sheetQ.addEventListener('input', drawSheet);
  sheetGo.addEventListener('click', function(){
    sheetGo.disabled = true;
    post('api/add', {transcript: transcript, people: chosen})
      .then(function(){ closeSheet(); hint.textContent = 'Added. They\'ll read the chat so far and join in.'; poll(); })
      .catch(function(e){ sheetGo.disabled = false; sheetMsg.textContent = 'Could not add: ' + e.message; });
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && sheet.classList.contains('on')) closeSheet(); });

  // ---- reply and @ tagging ------------------------------------------------------
  function setReply(i, name){ replyTo = i; replyBox.classList.toggle('on', i != null); replyText.textContent = i != null ? 'Replying to ' + name : ''; }
  document.getElementById('replyclear').addEventListener('click', function(){ setReply(null); });
  var mentionList = [], mentionSel = 0, mentionStart = -1, mentionQuery = null;
  function candidates(){ return seated().concat([AI]); }
  function closeMentions(){ mentionBox.classList.remove('on'); mentionList = []; mentionStart = -1; mentionQuery = null; }
  function openMentions(query){
    var q = query.toLowerCase();
    if(q !== mentionQuery){ mentionSel = 0; mentionQuery = q; } // a new query starts at the best match
    function rank(p){ // handle starts with it, then a word of the name starts with it, then anywhere in the name
      var h=(p.handle||'').toLowerCase(), n=(p.name||'').toLowerCase();
      if(!q || h.indexOf(q)===0) return 0;
      if(n.split(/\s+/).some(function(w){ return w.indexOf(q)===0; })) return 1;
      return n.indexOf(q)>=0 ? 2 : -1;
    }
    mentionList = candidates().map(function(p, i){ return {p:p, r:rank(p), i:i}; })
      .filter(function(x){ return x.r >= 0; })
      .sort(function(a, b){ return a.r - b.r || a.i - b.i; })
      .map(function(x){ return x.p; });
    if(!mentionList.length){ closeMentions(); return; }
    mentionSel = Math.min(mentionSel, mentionList.length-1);
    mentionBox.textContent = '';
    mentionList.forEach(function(p, i){
      var b=el('button'); b.type='button'; b.setAttribute('role','option'); if(i===mentionSel) b.classList.add('on');
      b.appendChild(avatar(p));
      var t=el('div'); t.appendChild(el('div','nm', p.kind==='self' ? 'Me ('+p.name+')' : p.name));
      t.appendChild(el('div','hd', '@'+p.handle + (p.kind==='ai' ? ' · the host: looks things up and answers you' : ''))); b.appendChild(t);
      b.addEventListener('mousedown', function(e){ e.preventDefault(); pickMention(p); });
      mentionBox.appendChild(b);
    });
    mentionBox.classList.add('on');
  }
  function pickMention(p){
    var v = msg.value, caret = msg.selectionStart;
    msg.value = v.slice(0, mentionStart) + '@' + p.handle + ' ' + v.slice(caret);
    var pos = mentionStart + p.handle.length + 2; msg.setSelectionRange(pos, pos);
    closeMentions(); msg.focus(); autosize();
  }
  function checkMention(){
    var v = msg.value.slice(0, msg.selectionStart), m = /(^|\s)@([A-Za-z0-9\-]*)$/.exec(v);
    if(m){ mentionStart = v.length - m[2].length - 1; openMentions(m[2]); } else closeMentions();
  }
  function tagsIn(text){
    var out = [], re = /@([A-Za-z0-9\-]+)/g, m;
    while((m = re.exec(text))){ var p = tagTarget(m[1]); if(p && out.indexOf(p.id)<0) out.push(p.id); }
    return out;
  }
  var pendingFiles = [], pendingBox = document.getElementById('pending'), fileInput = document.getElementById('files');
  function drawPending(){
    pendingBox.textContent = '';
    pendingFiles.forEach(function(f, i){
      var c = el('div','pend');
      if(/^image\//.test(f.type)){ var im = el('img'); im.src = URL.createObjectURL(f); c.appendChild(im); } else c.appendChild(svgIcon('file'));
      c.appendChild(el('span',null,f.name));
      var x = el('button'); x.appendChild(svgIcon('close')); x.type='button'; x.title='Remove'; x.addEventListener('click', function(){ pendingFiles.splice(i,1); drawPending(); }); c.appendChild(x);
      pendingBox.appendChild(c);
    });
  }
  document.getElementById('clip').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    Array.prototype.forEach.call(fileInput.files, function(f){
      if(pendingFiles.length >= 5){ hint.textContent = 'Up to 5 files per message.'; return; }
      if(f.size > 10*1024*1024){ hint.textContent = f.name + ' is over 10 MB.'; return; }
      pendingFiles.push(f);
    });
    fileInput.value = ''; drawPending(); msg.focus();
  });
  function readB64(f){ return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result).split(',')[1] || ''); }; r.onerror = rej; r.readAsDataURL(f); }); }
  function autosize(){ msg.style.height='auto'; msg.style.height=Math.min(160, msg.scrollHeight)+'px'; }
  function send(){
    var text = msg.value.trim(); if(!text && !pendingFiles.length) return;
    sendBtn.disabled = true;
    var to = tagsIn(text);
    if(pendingFiles.length) hint.textContent = 'Uploading ' + pendingFiles.length + (pendingFiles.length>1 ? ' files…' : ' file…');
    Promise.all(pendingFiles.map(function(f){ return readB64(f).then(function(d){ return {name: f.name, data: d}; }); }))
      .then(function(files){ return post('api/say', {transcript: transcript, text: text, replyTo: replyTo, to: to, files: files}); })
      .then(function(){
        msg.value=''; autosize(); setReply(null); pendingFiles = []; drawPending();
        var names = to.map(function(id){ return id==='ai' ? AI.name : (people[id]||{}).name; }).filter(Boolean);
        var reopened = badge.classList.contains('done');
        hint.textContent = (reopened ? 'Picked up again. ' : 'Sent. ') + (names.length ? names.join(' and ') + (names.length>1 ? ' answer' : ' answers') + ' next.' : 'The next speaker will respond to you.');
        poll();
      })
      .catch(function(e){ hint.textContent='Could not send: ' + e.message; })
      .then(function(){ sendBtn.disabled = false; });
  }
  sendBtn.addEventListener('click', send);
  msg.addEventListener('input', function(){ autosize(); checkMention(); });
  msg.addEventListener('click', checkMention);
  msg.addEventListener('blur', function(){ setTimeout(closeMentions, 120); });
  msg.addEventListener('keydown', function(e){
    if(mentionBox.classList.contains('on')){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); mentionSel=(mentionSel+(e.key==='ArrowDown'?1:mentionList.length-1))%mentionList.length; openMentions(msg.value.slice(mentionStart+1, msg.selectionStart)); return; }
      if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); pickMention(mentionList[mentionSel]); return; }
      if(e.key==='Escape'){ closeMentions(); return; }
    }
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  });
  var archived = !!data.archived, btnArch = document.getElementById('archbtn');
  function setArchivedBtn(a){ archived = a; setIcon(btnArch, a ? 'unarchive' : 'archive', a ? 'Unarchive' : 'Archive'); btnArch.title = a ? 'Move back to your chats' : 'Archive this chat (nothing is deleted)'; }
  setArchivedBtn(archived);
  btnArch.addEventListener('click', function(){
    post('api/archive', {transcript: transcript, archived: !archived}).then(function(j){
      setArchivedBtn(j.archived); hint.textContent = j.archived ? 'Archived. It\'s under Archived in your chat list; write here to bring it back.' : 'Moved back to your chats.';
      try { if(window.parent !== window) window.parent.postMessage({type:'aet-refresh'}, '*'); } catch(e){}
    }).catch(function(e){ hint.textContent = e.message; });
  });
  btnPause.addEventListener('click', function(){ post('api/control', {transcript: transcript, action: paused ? 'resume' : 'pause'}).then(poll).catch(function(e){ hint.textContent = e.message; }); });
  btnWrap.addEventListener('click', function(){ post('api/control', {transcript: transcript, action: 'wrap'}).then(poll).catch(function(e){ hint.textContent = e.message; }); });
  feed.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]'); if(!btn) return;
    var node = btn.closest('.item'), i = +node.dataset.index, p = people[node.dataset.who] || {name:'them'};
    if(btn.dataset.act==='reply'){ setReply(i, p.name); msg.focus(); return; }
    var bubble = node.querySelector('.bubble'), body = bubble.querySelector('.body'), acts = bubble.querySelector('.acts');
    if(bubble.querySelector('textarea')) return;
    var ta = el('textarea'); ta.value = Array.prototype.map.call(body.querySelectorAll('p'), function(x){ return x.textContent; }).join('\n\n');
    var row = el('div','acts'); row.style.display='flex';
    var save = el('button',null,'Save my words'), cancel = el('button',null,'Cancel'); save.type='button'; cancel.type='button';
    row.appendChild(save); row.appendChild(cancel);
    body.style.display='none'; acts.style.display='none';
    bubble.insertBefore(ta, acts); bubble.insertBefore(row, acts); ta.focus();
    function close(){ ta.remove(); row.remove(); body.style.display=''; acts.style.display=''; }
    cancel.addEventListener('click', close);
    save.addEventListener('click', function(){
      var text = ta.value.trim(); if(!text) return;
      save.disabled = true;
      post('api/edit', {transcript: transcript, index: i, text: text}).then(function(){
        body.textContent=''; paras(body, text, true);
        var who = bubble.querySelector('.who'); if(!who.querySelector('.edited')) who.appendChild(el('span','edited','· your words'));
        close(); hint.textContent='Saved. The table will carry on from your words.';
      }).catch(function(e){ save.disabled=false; hint.textContent='Could not save: ' + e.message; });
    });
  });
})();
</script>
</body>
